name: Supabase keep-alive

on:
  schedule:
    # Duas vezes por dia (00:15 e 12:15 UTC). O plano gratis pausa depois de
    # 7 dias sem atividade; com 2 toques por dia sobra folga mesmo se o GitHub
    # atrasar ou pular execucoes. O cron do GitHub so dispara na branch padrao.
    - cron: '15 0,12 * * *'
  workflow_dispatch:

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gravar atividade no Postgres
        env:
          # Opcional. Sem o segredo, o script usa a chave publicável já
          # commitada em js/config/supabase-config.js.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/supabase_keepalive.js
